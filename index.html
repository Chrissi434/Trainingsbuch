/* VOICE: ruhig, präzise, wie ein gutes Trainingsprotokoll
   IDEA: Hantelscheiben – die Olympia-Farben codieren Belastung, sonst Schwarz auf Weiß
   PICTURE: anatomische Figur vorne/hinten, antippbar und eingefärbt
   COLOUR and TYPE: fast Weiß / fast Schwarz, Scheibenrot als einziger Akzent; Barlow Condensed + Barlow
   LAYOUT: eine Spalte bis 720px, Abschnitte durch Haarlinien statt Kästen getrennt */
:root{color-scheme:light dark;--bg:light-dark(#fbfbfa,#0e0f10);--ink:light-dark(#111,#f2f1ee);--mut:light-dark(#6f6c66,#9d9a94);--line:light-dark(#e7e5e1,#232427);--m0:light-dark(#dcd9d3,#34353a);--sil:light-dark(#efede9,#1d1e21);--soft:light-dark(#f1f0ed,#1a1b1d);--card:var(--bg);--red:#d7263d;--blue:#1b6ef3;--grn:#1f9d55;--yel:#f2b705;--r:6px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:64px;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:38px}h2{font-size:24px}h3{font-size:19px}
p{margin:6px 0}a{color:inherit}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:6px max(4vw,16px)}
.brand{font:700 20px 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:8px;text-decoration:none}
.sync{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--grn)}.dot.warn{background:var(--yel)}.dot.err{background:var(--red)}
main{max-width:720px;margin:0 auto;padding:14px max(4vw,16px) 24px}
.card{padding:22px 0;border-top:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.mut{color:var(--mut)}.sm{font-size:14px}
button,.btn{font:600 15px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:var(--r);border:0;background:var(--soft);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:disabled{opacity:.4;cursor:default}
button.sm{font-size:14px;min-height:36px;padding:0 10px}
.pri{background:var(--ink);color:var(--bg)}.red{background:var(--red);color:#fff}
.ghost{background:transparent}.ico{width:44px;padding:0;font-size:18px}.wide{width:100%}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:16px Barlow,sans-serif;min-height:44px;padding:8px 10px;border-radius:var(--r);border:1px solid transparent;background:var(--soft);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--line)}
textarea{min-height:110px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
fieldset{border:0;padding:0;margin:20px 0 0}legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.opt span{min-height:36px;padding:0 12px;border-radius:4px;font:500 15px Barlow,sans-serif;border:0;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;cursor:pointer}
.chip.on,.opt input:checked+span{background:var(--ink);color:var(--bg)}
.opt{position:relative}.opt input{position:absolute;opacity:0;width:1px;height:1px}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:10px 0}
.fig2{text-align:center;font-size:13px}
.body{width:100%;max-height:430px;display:block}.mini .body{max-height:220px}
.sil{fill:var(--sil)}
.m{cursor:pointer;transition:fill .25s;stroke:var(--bg);stroke-width:1.4}
.pick .m:hover{opacity:.75}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 9px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:500}
nav.tabs a.on{color:var(--ink);font-weight:600}nav.tabs a.on svg{color:var(--red)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.linkish,button.linkish.sm{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:600;text-align:left;white-space:normal;color:inherit;justify-content:flex-start}
.tag{font-size:12.5px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--soft);color:var(--mut);white-space:nowrap;vertical-align:1px}
.tag.live{background:var(--red);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.stat{background:var(--bg);padding:4px 12px 4px 0}.stat+.stat{padding-left:12px}
.stat b{display:block;font:700 30px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px;background:none}.stat,.stat+.stat{padding:0}}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;align-items:end;height:120px;margin-top:10px;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-direction:column-reverse;height:100%}
.bar div{min-height:0}.bar .g{background:var(--red)}.bar .s{background:var(--blue)}
.bl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;font-size:13px;color:var(--mut);text-align:center;margin-top:4px}
.meter{height:4px;background:var(--soft);overflow:hidden;margin-top:5px}.meter div{height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:13px;color:var(--mut)}
.wd .c{height:6px;margin-top:6px;background:var(--soft)}
.wd .c.g{background:var(--red)}.wd .c.s{background:var(--blue)}
.wd.now span{color:var(--ink);font-weight:700}.wd.fut{opacity:.5}
.hero{background:var(--ink);color:var(--bg);border-radius:8px;padding:20px 20px 18px;margin-bottom:22px}
.hero h2{font-size:34px;margin:6px 0 4px}.hero p{color:color-mix(in srgb,var(--bg) 72%,transparent);margin:4px 0 14px}
.hero .hint{color:var(--bg);font-size:15px;border-left:2px solid var(--red);padding-left:10px}
.hero .kick{font-size:13px;color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hero .inv{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.big{font:700 56px/1 'Barlow Condensed',sans-serif;margin:4px 0}.big small{font-size:20px;font-weight:600;margin-left:6px}
.streak .big{color:var(--red)}
.pips{display:flex;gap:4px;margin-top:12px}.pips i{flex:1;height:8px;background:var(--soft)}.pips i.on{background:var(--red)}.pips i.bonus{background:var(--yel)}
.dl{font-size:13px;font-weight:600;white-space:nowrap}.dl.up{color:var(--grn)}.dl.down{color:var(--red)}
.hero .dl.up{color:#5fd38d}.hero .dl.down{color:#ff7a8a}
.seg{display:flex;background:var(--soft);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;background:transparent;min-height:36px;padding:0 6px;border-radius:4px;font-weight:500}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 2px #0002}
.tabs2{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs2 a{text-decoration:none;padding:8px 0;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 a.on{color:var(--ink);border-color:var(--red)}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-top:6px}
.setrow input{text-align:right}
.setrow .n{font-weight:600;color:var(--mut);text-align:center}
.ok{width:44px;padding:0}.ok.on{background:var(--grn);color:#fff}
.sethead{font-size:13px;color:var(--mut);margin-top:10px}
.restbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;display:flex;justify-content:center;pointer-events:none}
.restbar>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:4px 4px 4px 16px;display:flex;align-items:center;gap:6px;font-weight:600;box-shadow:0 6px 24px #0003}
.restbar button{min-height:36px;background:transparent;color:var(--bg);padding:0 10px}
.ov{position:fixed;inset:0;z-index:20;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px max(4vw,18px) calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:10px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-weight:600;max-width:90vw;box-shadow:0 6px 24px #0003}
.chart{position:relative;height:220px;margin-top:8px}.chart>svg{position:absolute;inset:0;width:100%;height:100%}
.chart text{font:13px Barlow,sans-serif;fill:var(--mut)}
.note{border-left:2px solid var(--line);padding:2px 0 2px 12px;font-size:15px;color:var(--mut)}
.note b{color:var(--ink)}
.steps{padding-left:20px;margin:6px 0}.steps li{margin:4px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.timer{font:700 40px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}.timer.done{color:var(--grn)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:12px 0}.check input{width:24px;height:24px;min-height:0;accent-color:var(--grn);margin:2px 0 0;flex:none}
.empty{text-align:center;padding:30px 10px}
@media(max-width:600px){h1{font-size:34px}.hero h2{font-size:30px}}
@media(prefers-reduced-motion:reduce){.m{transition:none}}
</style>
</head>
