/* VOICE: sachlich und motivierend, wie ein gut geführtes Trainingsbuch
   IDEA: Hantelscheiben – die Farben der Olympia-Scheiben codieren die Belastung
   PICTURE: anatomische Figur vorne/hinten, antippbar und nach Belastung eingefärbt
   COLOUR and TYPE: Kreideweiß / Gummiboden-Schwarz, Scheibenrot, -blau, -grün, -gelb; Barlow Condensed + Barlow
   LAYOUT: eine App-Spalte bis 760px, untere Tab-Leiste, ruhige Karten */
:root{color-scheme:light dark;--bg:light-dark(#f6f5f2,#111213);--card:light-dark(#fff,#1b1c1e);--ink:light-dark(#151515,#f1f0ec);--mut:light-dark(#66635d,#a3a09a);--line:light-dark(#e3e0da,#2e2f32);--m0:light-dark(#d6d2cb,#3c3d41);--sil:light-dark(#ebe8e3,#26272a);--soft:light-dark(#f0eee9,#242528);--red:#d7263d;--blue:#1b6ef3;--grn:#1f9d55;--yel:#f2b705}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:36px}h2{font-size:25px}h3{font-size:20px}
p{margin:6px 0}
a{color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px max(4vw,14px);border-bottom:1px solid var(--line)}
.brand{font:700 23px 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:8px;text-decoration:none}
.sync{margin-left:auto;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--grn)}.dot.warn{background:var(--yel)}.dot.err{background:var(--red)}
main{max-width:760px;margin:0 auto;padding:18px max(4vw,14px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.mut{color:var(--mut)}.sm{font-size:14px}
button,.btn{font:600 16px Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.red{background:var(--red);border-color:var(--red);color:#fff}
.ghost{background:transparent;border-color:transparent}
.ico{width:44px;padding:0}
.wide{width:100%}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:16px Barlow,sans-serif;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:110px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
fieldset{border:0;padding:0;margin:16px 0 0}legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.opt span{min-height:40px;padding:0 13px;border-radius:999px;font:500 15px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;cursor:pointer}
.chip.on,.opt input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt{position:relative}.opt input{position:absolute;opacity:0;width:1px;height:1px}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}
.fig2{text-align:center}
.body{width:100%;max-height:430px;display:block}
.mini .body{max-height:220px}
.sil{fill:var(--sil)}
.m{cursor:pointer;transition:fill .25s;stroke:var(--card);stroke-width:1.2}
.pick .m:hover{opacity:.75}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
nav.tabs a.on{color:var(--red)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.linkish{background:none;border:0;padding:0;min-height:0;font:inherit;font-weight:600;text-align:left;white-space:normal;color:inherit;justify-content:flex-start}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.live{background:var(--red);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:700 30px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:130px;margin-top:10px}
.bar{display:flex;flex-direction:column-reverse;height:100%}
.bar div{min-height:0}.bar .g{background:var(--red)}.bar .s{background:var(--blue)}
.bl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font-size:13px;color:var(--mut);text-align:center}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:4px}.meter div{height:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd .c{width:36px;height:36px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;border:2px solid var(--line);font-weight:600;font-size:15px}
.wd .c.g{background:var(--red);border-color:var(--red);color:#fff}.wd .c.s{background:var(--blue);border-color:var(--blue);color:#fff}.wd .c.p{border-style:dashed;border-color:var(--mut)}
.wd.now span{color:var(--ink);font-weight:700}
.hero h2{font-size:32px;margin:4px 0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;padding:0 6px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px #0002}
.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:6px}
.setrow input{text-align:right}
.setrow .n{font-weight:600;color:var(--mut);text-align:center}
.ok{width:46px;padding:0}.ok.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.sethead{font-size:13px;color:var(--mut);margin-top:10px}
.restbar{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;display:flex;justify-content:center;pointer-events:none}
.restbar>div{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 6px 4px 18px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 4px 18px #0004}
.restbar button{min-height:38px;background:transparent;color:var(--bg);border-color:#fff4;padding:0 10px}
.ov{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;max-width:90vw}
.chart{position:relative;height:230px;margin-top:8px}.chart>svg{position:absolute;inset:0;width:100%;height:100%}
.chart text{font:13px Barlow,sans-serif;fill:var(--mut)}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:15px}
.steps{padding-left:20px;margin:6px 0}.steps li{margin:4px 0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
.empty{text-align:center;padding:28px 10px}
@media(max-width:600px){h1{font-size:32px}.hero h2{font-size:28px}}
@media(prefers-reduced-motion:reduce){.m{transition:none}}
</style>
</head>
